# Edge Function gateway settings for deploys from this repo.
# quote-capture is a Wix webhook. Wix does not send a user JWT.
# Auth is WIX_SYNC_SECRET, checked inside the function.
#
# Deploy quote-capture and send-notification on purpose. A bare
# `supabase functions deploy` also uploads scheduled-tasks. Do not deploy
# scheduled-tasks from this repo unless you have compared it to live.

[functions.quote-capture]
verify_jwt = false

# Verify JWT stays OFF. send-notification checks the caller itself:
# a signed-in admin (or a driver, for claim / pass / offer) via the
# Authorization bearer token, or a server job via the x-notify-secret header.
# The secret is not accepted in the URL.
[functions.send-notification]
verify_jwt = false

[functions.scheduled-tasks]
verify_jwt = false
